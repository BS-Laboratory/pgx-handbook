project:
  type: book
  output-dir: _book
  # เรนเดอร์เฉพาะไฟล์ของหนังสือ ไม่รวม README.qmd (ซึ่งไว้สร้างหน้า GitHub + PDF เล่มเดียวแยกต่างหาก)
  render:
    - index.qmd
    - chapters/preface.qmd
    - chapters/ch01.qmd
    - chapters/ch02.qmd
    - chapters/ch03.qmd
    - chapters/ch04.qmd
    - chapters/ch05.qmd
    - chapters/ch06.qmd
    - chapters/ch07.qmd
    - chapters/ch08.qmd
    - chapters/ch09.qmd
    - chapters/ch10.qmd
    - chapters/ch11.qmd
    - chapters/ch12.qmd
    - chapters/ch13.qmd
    - chapters/appendix.qmd

book:
  title: "คู่มือเภสัชพันธุศาสตร์สำหรับประชาชน (PGx Handbook)"
  author: "Bhoom Suktitipat Laboratory"
  date: today
  search: true
  reader-mode: true
  downloads: [pdf]
  repo-url: https://github.com/BS-Laboratory/pgx-handbook
  repo-actions: [source, issue]
  page-footer:
    left: "คู่มือเภสัชพันธุศาสตร์สำหรับประชาชน (PGx Handbook)"
    center:
      - text: "GitHub Repository"
        href: https://github.com/BS-Laboratory/pgx-handbook
    right: "Bhoom Suktitipat Laboratory"
  chapters:
    - index.qmd
    - chapters/preface.qmd
    - chapters/ch01.qmd
    - chapters/ch02.qmd
    - chapters/ch03.qmd
    - chapters/ch04.qmd
    - chapters/ch05.qmd
    - chapters/ch06.qmd
    - chapters/ch07.qmd
    - chapters/ch08.qmd
    - chapters/ch09.qmd
    - chapters/ch10.qmd
    - chapters/ch11.qmd
    - chapters/ch12.qmd
    - chapters/ch13.qmd
    - chapters/appendix.qmd

lang: th

# คลิกที่รูปเพื่อขยายเต็มจอ (lightbox) ทุกรูปในเว็บ
lightbox: auto

format:
  html:
    theme:
      light: [cosmo, custom.scss]
      dark: [darkly, custom-dark.scss]
    toc: true
    toc-depth: 2
    toc-title: "ในบทนี้"
    number-sections: false
    fontsize: 1.05rem
    linestretch: 1.6
    code-copy: true
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  pdf:
    documentclass: report
    pdf-engine: xelatex
    mainfont: "Sarabun"
    fontsize: 11pt
    toc: true
    toc-depth: 2
    number-sections: false
    geometry: margin=1in
    linestretch: 1.2
    include-in-header: pdf-header.tex

# ธีมของ Mermaid decision tree ให้เข้ากับเว็บ
mermaid:
  theme: neutral
