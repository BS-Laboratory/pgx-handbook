name: Publish PGx Handbook (Quarto Book to GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto (with TinyTeX for PDF)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      # ติดตั้งฟอนต์ไทย Sarabun ให้ xelatex ใช้สร้าง PDF บนเซิร์ฟเวอร์
      # (Ubuntu runner ไม่มีฟอนต์ Thonburi ของ macOS)
      - name: Install Thai font (Sarabun)
        run: |
          mkdir -p ~/.local/share/fonts
          base="https://github.com/google/fonts/raw/main/ofl/sarabun"
          for f in Sarabun-Regular Sarabun-Bold Sarabun-Italic Sarabun-BoldItalic; do
            curl -fsSL "$base/$f.ttf" -o ~/.local/share/fonts/$f.ttf
          done
          fc-cache -f
          fc-list | grep -i sarabun || true

      - name: Render book (HTML)
        run: quarto render --to html

      # สร้าง PDF ด้วย ถ้าพลาดไม่ให้ล้มทั้ง workflow (เว็บ HTML ยังขึ้นปกติ)
      - name: Render book (PDF)
        run: quarto render --to pdf
        continue-on-error: true

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
