name: Publish PGx Handbook (Quarto Book to GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# ยกเลิก run เก่าที่ยังค้างอยู่อัตโนมัติเมื่อมี run ใหม่
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # เรนเดอร์เฉพาะ HTML (เร็ว เสถียร)
      # PDF เรนเดอร์บนเครื่อง Mac แยก เพราะ Mermaid ต้องใช้เบราว์เซอร์ซึ่งไม่เสถียรบน CI
      - name: Render book (HTML)
        run: quarto render --to html

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
